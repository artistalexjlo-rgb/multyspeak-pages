<!-- ЗАЧЕМ ЭТОТ ФАЙЛ (2026-08-07). Без него Cloudflare Pages на любой неизвестный путь
     отдавал корневой index.html С КОДОМ 200 — soft-404. Проверено: /en/ar/money/ и
     заведомо несуществующий /zzz-nonexistent-xyz/ возвращали посимвольно одно и то же.
     Хуже: в корневом index.html стоит location.replace("/<lang>/"), то есть мёртвый
     адрес ещё и уводил на главную. Для Google это «страница есть, но noindex» — он
     держит её в отчёте и тратит на неё обход, вместо того чтобы снять как ненайденную.
     ⛔ Здесь НЕТ редиректа намеренно: 404, который уводит на главную, снова прячет
     ошибку — и от нас, и от поисковика. Ссылки даём, уходить решает человек. -->

  body{background:#06080d;color:#e8f1f8;font-family:-apple-system,Segoe UI,sans-serif;

</style></head>
